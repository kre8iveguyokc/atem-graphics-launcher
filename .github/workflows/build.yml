name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            dist: dist:win
            artifact: ATEM-Graphics-Launcher-windows-x64
            files: dist/*.exe
          - label: macOS Intel x64
            os: macos-15-intel
            dist: dist:mac:x64
            artifact: ATEM-Graphics-Launcher-macos-intel-x64
            files: dist/*.zip
          - label: macOS Apple Silicon arm64
            os: macos-latest
            dist: dist:mac:arm64
            artifact: ATEM-Graphics-Launcher-macos-arm64
            files: dist/*.zip
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Native helper with the Blackmagic ATEM Switchers SDK session (vendored headers in
      # native/helper/sdk). agl-helper-mock (simulated switcher) is built for tests only
      # and never packaged.
      - name: Build SDK helper
        shell: bash
        run: |
          set -o pipefail
          if ! npm run helper:build 2>&1 | tee helper-build.log; then
            # Surface compiler errors as annotations (visible without downloading logs).
            grep -iE "error" helper-build.log | head -15 | sed 's/^/::error title=helper build::/'
            exit 1
          fi

      - name: Unit + integration tests
        shell: bash
        env:
          AGL_REQUIRE_HELPER: '1'
        run: |
          set -o pipefail
          if ! npm test 2>&1 | tee test.log; then
            # Name the failing tests and their errors as annotations.
            grep -E "^not ok|^ *not ok|error: |expected:|actual:|Error:" test.log | head -25 | sed 's/^/::error title=tests::/'
            exit 1
          fi

      # Also proves the shipped helper contains the Blackmagic SDK session. CI machines have
      # no ATEM software installed, so it must report that cleanly rather than hang or crash.
      - name: Smoke test (launches the app in test mode)
        run: npx electron . --smoke-test
        env:
          AGL_REQUIRE_HELPER: '1'
          AGL_EXPECT_SDK: '1'

      - name: Package
        run: npm run ${{ matrix.dist }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
